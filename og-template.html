<!DOCTYPE html>
<!--
  Not part of the site — a stencil for generating og.png.

  How to use: open this page, set your browser window/device toolbar to exactly
  1200 x 630, screenshot it, save as og.png in the project root. Then uncomment
  the og:image tags in index.html.

  Nothing links here and robots.txt doesn't need to exclude it, but it will not
  appear in the sitemap either.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OG image stencil — 1200×630</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <style>
        * { margin: 0; box-sizing: border-box; }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            background: #57534a;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }

        .card {
            width: 1200px;
            height: 630px;
            padding: 5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #f4f1ea;
            color: #15140f;
            /* the same hairline the site uses, scaled up */
            border-bottom: 10px solid #b23c17;
        }

        .eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.25rem;
            letter-spacing: 0.11em;
            text-transform: uppercase;
            color: #b23c17;
        }

        .headline {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 5.25rem;
            font-weight: 600;
            font-variation-settings: 'opsz' 120;
            line-height: 1.02;
            letter-spacing: -0.025em;
            max-width: 17ch;
        }

        .headline em { font-style: italic; font-weight: 400; color: #b23c17; }

        .foot {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.375rem;
            color: #5d5a51;
        }

        .name { color: #15140f; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <p class="eyebrow">Developer &middot; Johannesburg</p>

        <h1 class="headline">I build small web products and <em>run the ones that work.</em></h1>

        <div class="foot">
            <span class="name">William McIlleron</span>
            <span>williammcilleron.netlify.app</span>
        </div>
    </div>
</body>
</html>
