# This repo now deploys on Cloudflare Pages (https://williammcilleron.com).
# The old Netlify site is kept only so links already out in the world keep
# working: every path sends the visitor to the same path on the new domain.
[[redirects]]
  from = "/*"
  to = "https://williammcilleron.com/:splat"
  status = 301
  force = true
