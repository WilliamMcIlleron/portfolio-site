<!DOCTYPE html>
<!--
  Not part of the site. A tool for making Instagram posts.

  The canvas is exactly 1080 x 1350, which is Instagram's tallest feed size
  and therefore the most screen it will give you. Text is editable in place,
  so nothing here needs code changes to use.

  Two ways to get a file out:
    1. Download PNG. Quick, and good enough for most posts.
    2. Devtools, Elements panel, right-click the div with id "canvas",
       Capture node screenshot. Slower, and exact, including webfonts.

  Set preview scale back to 100% before either.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
    :root {
        --paper: #faf7f2; --tint: #f2ede4; --ink: #2a2622;
        --muted: #6b6259; --rule: #e2dace; --accent: #8a5539;
        --serif: 'Fraunces', Georgia, serif;
        --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --mono: 'IBM Plex Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; }
    body { background: #4a4540; font-family: var(--sans); color: #eee; padding: 1.5rem; }

    /* --- Controls ------------------------------------------------------- */
    .bar {
        position: sticky; top: 0; z-index: 10;
        display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; align-items: center;
        background: #2f2b27; border: 1px solid #565049; border-radius: 8px;
        padding: 0.875rem 1.125rem; margin-bottom: 1.5rem;
    }
    .bar label { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: #b8afa5; }
    .bar select, .bar input[type=file], .bar button, .bar input[type=range] { font: inherit; font-size: 0.875rem; }
    .bar select, .bar button {
        background: #46403a; color: #fff; border: 1px solid #6b635a;
        border-radius: 5px; padding: 0.45rem 0.7rem; cursor: pointer;
    }
    .bar button:hover { background: #574f47; }
    .bar .go { background: var(--accent); border-color: var(--accent); }
    .bar .go:hover { background: #9c6644; }
    .swatch { width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 2px solid #6b635a; cursor: pointer; padding: 0; }
    .swatch[aria-pressed=true] { border-color: #fff; }
    .hint { font-size: 0.8125rem; color: #b8afa5; max-width: 62ch; margin-bottom: 1.25rem; line-height: 1.5; }
    .hint code { font-family: var(--mono); color: #f0d9c8; }

    /* --- Canvas --------------------------------------------------------- */
    .stage { transform-origin: top left; }
    #canvas {
        width: 1080px; height: 1350px;
        position: relative; overflow: hidden;
        background: var(--paper); color: var(--ink);
        display: flex; flex-direction: column;
    }
    [contenteditable]:focus { outline: 2px dashed var(--accent); outline-offset: 6px; }

    /* Shared furniture */
    .pad { padding: 90px; }
    .eyebrow { font-family: var(--mono); font-size: 26px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
    .handle { font-family: var(--mono); font-size: 26px; letter-spacing: 0.1em; color: var(--muted); }
    .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }

    /* Device frames */
    .phone { width: 460px; border: 14px solid var(--ink); border-radius: 52px; overflow: hidden; background: var(--ink); box-shadow: 0 30px 60px rgba(0,0,0,.22); }
    .phone img { width: 100%; display: block; }
    .browser { width: 100%; border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 30px 60px rgba(0,0,0,.18); }
    .browser__bar { height: 46px; background: var(--tint); display: flex; align-items: center; gap: 9px; padding: 0 18px; border-bottom: 1px solid var(--rule); }
    .browser__bar i { width: 12px; height: 12px; border-radius: 50%; background: #c9c0b3; display: block; }
    .browser img { width: 100%; display: block; }
    .drop { display: grid; place-items: center; min-height: 320px; background: var(--tint); color: var(--muted); font-size: 24px; text-align: center; padding: 40px; }
</style>
</head>
<body>

<div class="bar">
    <label for="tpl">Template</label>
    <select id="tpl">
        <option value="screen">Screen · one shot</option>
        <option value="split">Before and after</option>
        <option value="statement">Statement</option>
        <option value="intro">Intro · you</option>
        <option value="slide">Carousel slide</option>
    </select>

    <label for="frame">Frame</label>
    <select id="frame">
        <option value="phone">Phone</option>
        <option value="browser">Browser</option>
        <option value="none">None</option>
    </select>

    <label>Background</label>
    <button class="swatch" data-bg="#faf7f2" style="background:#faf7f2" aria-pressed="true" title="Paper"></button>
    <button class="swatch" data-bg="#f2ede4" style="background:#f2ede4" aria-pressed="false" title="Tint"></button>
    <button class="swatch" data-bg="#2a2622" style="background:#2a2622" aria-pressed="false" title="Ink"></button>
    <button class="swatch" data-bg="#8a5539" style="background:#8a5539" aria-pressed="false" title="Accent"></button>

    <label for="img">Image</label>
    <input type="file" id="img" accept="image/*">

    <label for="img2" id="img2label" hidden>Second</label>
    <input type="file" id="img2" accept="image/*" hidden>

    <label for="scale">Preview <span id="scaleVal">50%</span></label>
    <input type="range" id="scale" min="20" max="100" step="5" value="50">

    <button class="go" id="save">Download PNG</button>
</div>

<p class="hint">
    Click any text to edit it. Drop a screenshot in with the Image picker.
    For exact webfonts, set preview to 100%, then in devtools right-click
    <code>#canvas</code> in the Elements panel and choose <code>Capture node screenshot</code>.
</p>

<div class="stage" id="stage">
    <div id="canvas"></div>
</div>

<script>
(function () {
    'use strict';

    var canvas = document.getElementById('canvas');
    var stage = document.getElementById('stage');
    var tpl = document.getElementById('tpl');
    var frameSel = document.getElementById('frame');
    var scale = document.getElementById('scale');
    var scaleVal = document.getElementById('scaleVal');

    var state = { bg: '#faf7f2', img: null, img2: null };

    function dark() { return state.bg === '#2a2622' || state.bg === '#8a5539'; }

    // One shot rendered inside whichever frame is selected.
    function framed(src, wide) {
        var inner = src
            ? '<img src="' + src + '" alt="">'
            : '<div class="drop">Pick a screenshot<br>with the Image button above</div>';
        var f = frameSel.value;
        if (f === 'phone') return '<div class="phone" style="width:' + (wide ? '380px' : '460px') + '">' + inner + '</div>';
        if (f === 'browser') return '<div class="browser"><div class="browser__bar"><i></i><i></i><i></i></div>' + inner + '</div>';
        return '<div style="width:100%;border-radius:8px;overflow:hidden">' + inner + '</div>';
    }

    var TEMPLATES = {
        screen: function () {
            return '<div class="pad" style="height:100%;display:flex;flex-direction:column;gap:56px">' +
                '<div>' +
                  '<p class="eyebrow" contenteditable>Lumen · wedding photographer sites</p>' +
                  '<h1 contenteditable style="font-family:var(--serif);font-weight:400;font-size:76px;line-height:1.05;letter-spacing:-.02em;margin-top:22px;max-width:15ch">A page for every town you shoot.</h1>' +
                '</div>' +
                '<div style="flex:1;display:grid;place-items:center;min-height:0">' + framed(state.img) + '</div>' +
                '<div class="foot"><span class="handle" contenteditable>@williamwebdev</span>' +
                '<span class="handle" contenteditable>Swipe →</span></div>' +
              '</div>';
        },

        split: function () {
            return '<div class="pad" style="height:100%;display:flex;flex-direction:column;gap:44px">' +
                '<h1 contenteditable style="font-family:var(--serif);font-weight:400;font-size:72px;line-height:1.05;letter-spacing:-.02em;max-width:16ch">Same photographer. Different result.</h1>' +
                '<div style="flex:1;display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;min-height:0">' +
                  '<div><p class="eyebrow" style="margin-bottom:18px" contenteditable>Before</p>' + framed(state.img, true) + '</div>' +
                  '<div><p class="eyebrow" style="margin-bottom:18px" contenteditable>After</p>' + framed(state.img2, true) + '</div>' +
                '</div>' +
                '<div class="foot"><span class="handle" contenteditable>@williamwebdev</span></div>' +
              '</div>';
        },

        statement: function () {
            return '<div class="pad" style="height:100%;display:flex;flex-direction:column;justify-content:center;gap:40px">' +
                '<p class="eyebrow" contenteditable>For wedding photographers</p>' +
                '<h1 contenteditable style="font-family:var(--serif);font-weight:400;font-size:96px;line-height:1.02;letter-spacing:-.03em">Couples don\'t search your name. They search your town.</h1>' +
                '<p contenteditable style="font-size:34px;line-height:1.5;color:var(--muted);max-width:26ch">Which is why your site needs a page for each one.</p>' +
                '<div class="foot" style="margin-top:60px"><span class="handle" contenteditable>@williamwebdev</span></div>' +
              '</div>';
        },

        intro: function () {
            return '<div style="height:100%;display:grid;grid-template-rows:1fr auto">' +
                '<div style="overflow:hidden;background:var(--tint);display:grid;place-items:center">' +
                  (state.img ? '<img src="' + state.img + '" alt="" style="width:100%;height:100%;object-fit:cover">'
                             : '<div class="drop" style="min-height:100%;width:100%">A photograph of you</div>') +
                '</div>' +
                '<div class="pad" style="padding:70px 90px 90px">' +
                  '<h1 contenteditable style="font-family:var(--serif);font-weight:400;font-size:72px;line-height:1.05;letter-spacing:-.02em">Hi, I\'m William.</h1>' +
                  '<p contenteditable style="font-size:34px;line-height:1.45;color:var(--muted);margin-top:22px;max-width:28ch">I build websites for wedding photographers, and I look after them afterwards.</p>' +
                  '<div class="foot" style="margin-top:44px"><span class="handle" contenteditable>@williamwebdev</span>' +
                  '<span class="handle" contenteditable>Johannesburg</span></div>' +
                '</div>' +
              '</div>';
        },

        slide: function () {
            return '<div class="pad" style="height:100%;display:flex;flex-direction:column">' +
                '<p class="eyebrow" contenteditable>01 / 05</p>' +
                '<h1 contenteditable style="font-family:var(--serif);font-weight:400;font-size:84px;line-height:1.04;letter-spacing:-.025em;margin-top:auto;max-width:15ch">The three pages photographers get wrong.</h1>' +
                '<p contenteditable style="font-size:34px;line-height:1.5;color:var(--muted);margin-top:32px;max-width:28ch">And what to put on them instead.</p>' +
                '<div class="foot" style="margin-top:auto"><span class="handle" contenteditable>@williamwebdev</span>' +
                '<span class="handle" contenteditable>Swipe →</span></div>' +
              '</div>';
        }
    };

    function render() {
        canvas.style.background = state.bg;
        canvas.style.color = dark() ? '#faf7f2' : '#2a2622';
        canvas.innerHTML = TEMPLATES[tpl.value]();

        if (dark()) {
            canvas.querySelectorAll('.eyebrow').forEach(function (el) { el.style.color = '#e8c9b4'; });
            canvas.querySelectorAll('.handle, p[style*="--muted"]').forEach(function (el) { el.style.color = 'rgba(250,247,242,.72)'; });
            canvas.querySelectorAll('p').forEach(function (el) {
                if (el.style.color.indexOf('muted') > -1) el.style.color = 'rgba(250,247,242,.72)';
            });
        }

        var needsTwo = tpl.value === 'split';
        document.getElementById('img2').hidden = !needsTwo;
        document.getElementById('img2label').hidden = !needsTwo;
        frameSel.disabled = tpl.value === 'statement' || tpl.value === 'intro' || tpl.value === 'slide';
    }

    /* --- Controls ------------------------------------------------------- */

    tpl.addEventListener('change', render);
    frameSel.addEventListener('change', render);

    document.querySelectorAll('.swatch').forEach(function (btn) {
        btn.addEventListener('click', function () {
            state.bg = btn.dataset.bg;
            document.querySelectorAll('.swatch').forEach(function (b) {
                b.setAttribute('aria-pressed', String(b === btn));
            });
            render();
        });
    });

    function readInto(input, key) {
        input.addEventListener('change', function () {
            var file = input.files && input.files[0];
            if (!file) return;
            var reader = new FileReader();
            // Data URL rather than object URL, so the PNG export isn't tainted.
            reader.onload = function () { state[key] = reader.result; render(); };
            reader.readAsDataURL(file);
        });
    }
    readInto(document.getElementById('img'), 'img');
    readInto(document.getElementById('img2'), 'img2');

    function applyScale() {
        var s = Number(scale.value) / 100;
        stage.style.transform = 'scale(' + s + ')';
        stage.style.height = (1350 * s) + 'px';
        stage.style.width = (1080 * s) + 'px';
        scaleVal.textContent = scale.value + '%';
    }
    scale.addEventListener('input', applyScale);

    /* --- Export --------------------------------------------------------- */

    // Renders the canvas through an SVG foreignObject. Webfonts are not
    // available inside that, so the export falls back to Georgia. Use the
    // devtools node screenshot when the exact face matters.
    document.getElementById('save').addEventListener('click', function () {
        var clone = canvas.cloneNode(true);
        clone.querySelectorAll('[contenteditable]').forEach(function (el) { el.removeAttribute('contenteditable'); });

        var css = '';
        try {
            Array.prototype.forEach.call(document.styleSheets, function (sheet) {
                try {
                    Array.prototype.forEach.call(sheet.cssRules, function (rule) {
                        if (rule.cssText.indexOf('@font-face') !== 0) css += rule.cssText + '\n';
                    });
                } catch (e) { /* cross-origin sheet, skip */ }
            });
        } catch (e) { /* ignore */ }

        // Built as real nodes and serialised with XMLSerializer, not string
        // concatenation. foreignObject is parsed as XML, so outerHTML's
        // unclosed <img> and <br> tags make the whole SVG fail to load.
        var XHTML = 'http://www.w3.org/1999/xhtml';
        var SVGNS = 'http://www.w3.org/2000/svg';

        var holder = document.createElementNS(XHTML, 'div');
        var styleEl = document.createElementNS(XHTML, 'style');
        styleEl.textContent = css;
        holder.appendChild(styleEl);
        holder.appendChild(clone);

        var svgEl = document.createElementNS(SVGNS, 'svg');
        svgEl.setAttribute('width', '1080');
        svgEl.setAttribute('height', '1350');
        var fo = document.createElementNS(SVGNS, 'foreignObject');
        fo.setAttribute('width', '100%');
        fo.setAttribute('height', '100%');
        fo.appendChild(holder);
        svgEl.appendChild(fo);

        var svg = new XMLSerializer().serializeToString(svgEl);

        var img = new Image();
        img.onload = function () {
            var c = document.createElement('canvas');
            c.width = 1080; c.height = 1350;
            var ctx = c.getContext('2d');
            ctx.fillStyle = state.bg;
            ctx.fillRect(0, 0, 1080, 1350);
            ctx.drawImage(img, 0, 0);
            c.toBlob(function (blob) {
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'post-' + tpl.value + '.png';
                document.body.appendChild(a); a.click(); a.remove();
                URL.revokeObjectURL(url);
            }, 'image/png');
        };
        img.onerror = function () {
            alert('Export failed. Use the devtools node screenshot instead: Elements panel, right-click #canvas, Capture node screenshot.');
        };
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    });

    applyScale();
    render();
})();
</script>
</body>
</html>
